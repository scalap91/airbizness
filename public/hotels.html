<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);
  --orange:#b8962e;--orange-h:#d4ae4a;
  --text:#f0ece4;--text2:#a09890;--text3:#6a6058;
  --border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);
  --r:6px;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:400;min-height:100vh;overflow-x:hidden;line-height:1.6;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:rgba(15,15,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-hex{width:32px;height:32px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:grid;place-items:center;font-size:13px;color:#000;}
.logo-text{font-size:19px;font-weight:600;color:var(--text);}
.back-link{color:var(--text2);font-size:13px;text-decoration:none;}
.back-link:hover{color:var(--gold2);}

/* HERO + SEARCH — COMPACTÉ (was 88+28=116px → maintenant ~80px) */
.hero{padding:78px 32px 18px;background:linear-gradient(180deg,#1a1a1a 0%,var(--bg) 100%);border-bottom:1px solid var(--border);}
.hero-inner{max-width:1280px;margin:0 auto;}
.hero-title{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);line-height:1.1;margin-bottom:14px;}
.hero-title em{font-style:italic;color:var(--gold2);}

.search-bar{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;display:grid;grid-template-columns:1.3fr 0.9fr 0.9fr 0.8fr auto;gap:8px;align-items:end;}
@media(max-width:820px){.search-bar{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.search-bar{grid-template-columns:1fr;}}
.sf{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 11px;}
.sf-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.sf input,.sf select{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;}
.sf input[type=date]{color-scheme:dark;}
.search-btn{padding:11px 22px;background:var(--gold);border:none;color:#000;font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:0.3px;cursor:pointer;border-radius:8px;white-space:nowrap;}
.search-btn:hover{background:var(--gold2);}

/* ── Recherche hôtel par nom (Pascal 2026-05-29) ── */
.hns{position:relative;max-width:520px;margin-bottom:14px;}
.hns-label{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.hns-label svg{width:13px;height:13px;stroke:var(--gold2);fill:none;stroke-width:1.7;}
.hns input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;}
.hns input::placeholder{color:var(--text3);font-style:italic;}
.hns input:focus{border-color:var(--gold2);}
.hns-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;max-height:320px;overflow-y:auto;z-index:200;box-shadow:0 12px 32px rgba(0,0,0,0.5);display:none;}
.hns-it{padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s;}
.hns-it:last-child{border-bottom:none;}
.hns-it:hover,.hns-it.on{background:var(--bg3);}
.hns-it strong{display:block;font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hns-it span{display:block;font-size:11.5px;color:var(--text3);margin-top:1px;}
.hns-empty{padding:13px;color:var(--text3);text-align:center;font-size:12.5px;}

/* RESULTS — 3 colonnes desktop, plus dense */
.results{padding:24px 32px 80px;max-width:1280px;margin:0 auto;}
.results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:14px;flex-wrap:wrap;}
.results-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);}
.results-title em{font-style:italic;color:var(--gold2);}
.results-count{color:var(--text2);font-size:12.5px;}

/* CARDS COMPACTES OTA */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:border-color .2s,transform .15s;position:relative;}
.card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.45);}

/* Image plus petite et plus large (16/9 au lieu de 4/3) */
.card-img{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1410 0%,#1a1a1a 60%,#1a1f2a 100%);position:relative;overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-img-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:3.4rem;color:var(--gold);opacity:0.2;font-weight:300;}

/* ── GALERIE PHOTOS NAVIGABLE (mobile swipe + desktop arrows) ── */
.gallery-track{display:flex;width:100%;height:100%;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform;touch-action:pan-y pinch-zoom;}
.gallery-slide{flex:0 0 100%;width:100%;height:100%;}
.gallery-slide img{width:100%;height:100%;object-fit:cover;}
/* Flèches carrousel : toujours visibles en semi-transparence,
   plein opacité au hover. Fix 2026-05-31 (Pascal) : avant cachées par défaut
   et révélées seulement en @media(hover:hover) → invisibles en device-emulation
   DevTools + invisibles sur tactile. */
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);border:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:18px;z-index:3;transition:background .15s,opacity .2s;opacity:0.75;}
.gallery-arrow.prev{left:8px;}
.gallery-arrow.next{right:8px;}
.gallery-arrow:hover{background:rgba(0,0,0,0.85);opacity:1;}
.gallery-arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
/* Card hover (desktop) → flèches plein opacité */
@media(hover:hover) and (pointer:fine){
  .card:hover .gallery-arrow{opacity:1;}
}
.gallery-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:3;pointer-events:none;}
.gallery-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.45);transition:background .2s,width .2s;}
.gallery-dot.active{background:#fff;width:14px;border-radius:99px;}
.gallery-count{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);padding:4px 9px;border-radius:99px;font-size:10.5px;color:#fff;letter-spacing:0.2px;z-index:3;display:flex;align-items:center;gap:5px;}
.gallery-count svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;}

/* ── FAVORI ❤ (mobile tap + desktop) ── */
.card-fav{position:absolute;top:10px;right:10px;width:36px;height:36px;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);border:none;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:4;color:#fff;transition:background .15s,transform .2s;-webkit-tap-highlight-color:transparent;}
.card-fav:hover,.card-fav:active{background:rgba(0,0,0,0.78);transform:scale(1.06);}
.card-fav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s,stroke .2s;}
.card-fav.faved svg{fill:#cc3a4a;stroke:#cc3a4a;}
.card-fav.pulse{animation:fav-pulse .35s ease;}
@keyframes fav-pulse{0%{transform:scale(1);}50%{transform:scale(1.25);}100%{transform:scale(1);}}

/* Étoiles : décalées si favori présent (avant top:10px right:10px) */
.card-stars{position:absolute;top:10px;right:56px;font-size:10px;letter-spacing:0.15em;color:var(--gold2);background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);padding:3px 8px;border-radius:5px;}

/* Badges en overlay top-left */
.card-badges{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;max-width:78%;}
.badge{font-size:10px;font-weight:600;letter-spacing:0.3px;padding:4px 9px;border-radius:5px;backdrop-filter:blur(8px);white-space:nowrap;}
.badge-cancel{background:rgba(74,222,128,0.18);color:#7ddc94;border:1px solid rgba(74,222,128,0.3);}
.badge-business{background:rgba(212,174,74,0.22);color:#e6c878;border:1px solid rgba(212,174,74,0.4);}
.badge-breakfast{background:rgba(96,165,250,0.18);color:#8fbcfa;border:1px solid rgba(96,165,250,0.3);}
.badge-urgent{background:rgba(184,150,46,0.22);color:#d4ae4a;border:1px solid rgba(184,150,46,0.4);}
.badge-nrf{background:rgba(220,80,80,0.18);color:#f08c8c;border:1px solid rgba(220,80,80,0.3);}

/* Stars top-right au-dessus de l'image */
/* (.card-stars repositionné dans le bloc galerie ci-dessus) */

/* Body card — DENSE */
.card-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:8px;}
.card-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.card-name{font-family:'DM Serif Display',serif;font-size:16.5px;line-height:1.15;color:var(--text);letter-spacing:-0.01em;flex:1;}
.card-rating{flex-shrink:0;display:flex;align-items:center;gap:4px;background:var(--gold-dim);padding:3px 7px;border-radius:5px;font-size:11px;color:var(--gold2);font-weight:600;}
.card-rating .star{font-size:10px;}

.card-loc{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.card-loc::before{content:'•';font-size:14px;color:var(--gold2);}
.card-dist{color:var(--gold2);font-weight:500;}

/* Features icons row */
.card-features{display:flex;gap:10px;font-size:11px;color:var(--text3);flex-wrap:wrap;margin-top:2px;}
.card-features span{display:inline-flex;align-items:center;gap:4px;}

/* Prix block + CTA */
.card-price-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);gap:10px;}
.card-price-block{display:flex;flex-direction:column;align-items:flex-start;}
.card-price-strike{font-size:12px;color:var(--text3);text-decoration:line-through;margin-bottom:1px;line-height:1;}
.card-price-now{font-family:'DM Serif Display',serif;font-size:26px;color:#fff;line-height:1;letter-spacing:-0.01em;font-weight:400;}
.card-price-night{font-size:11px;color:var(--text3);margin-top:3px;}
.card-discount{display:inline-block;background:#22c55e;color:#0a1a0a;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;margin-top:4px;letter-spacing:0.3px;}

.cta-btn{flex-shrink:0;padding:10px 18px;background:var(--gold);color:#000;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:0.3px;cursor:pointer;text-decoration:none;transition:background .15s;white-space:nowrap;}
.cta-btn:hover{background:var(--gold2);}

@media(max-width:560px){
  .results{padding:18px 14px 80px;}
  .grid{grid-template-columns:1fr;gap:12px;}
  .card-name{font-size:16px;}
  .card-price-now{font-size:24px;}
}

.empty{text-align:center;padding:80px 24px;color:var(--text3);}
.empty h3{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);margin-bottom:10px;}
.loading{padding:60px 24px;text-align:center;color:var(--text3);}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

.notice{background:var(--gold-dim);border:1px solid var(--border2);border-radius:8px;padding:10px 16px;font-size:12px;color:var(--gold2);margin-bottom:20px;}
</style>

<script>
// Concierge hôtelier — persiste on_behalf_of dès l'arrivée (Pascal 2026-05-24)
(function(){
  try {
    const _u = new URLSearchParams(location.search);
    const obh = _u.get('on_behalf_of');
    if (obh){
      sessionStorage.setItem('ab_on_behalf_of', obh);
      const gn = _u.get('guest_name'); if (gn) sessionStorage.setItem('ab_guest_name', gn);
      const ge = _u.get('guest_email'); if (ge) sessionStorage.setItem('ab_guest_email', ge);
      const gr = _u.get('guest_ref'); if (gr) sessionStorage.setItem('ab_guest_ref', gr);
    }
  } catch(e){}
})();
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ── Recherche hôtel par nom (Pascal 2026-05-29) → fiche SEO ──
(function setupHotelNameSearch(){
  const input = document.getElementById('hns-q');
  const dd = document.getElementById('hns-dd');
  if (!input || !dd) return;
  let t = null, idx = -1, items = [];
  function render(rs){
    items = rs || []; idx = -1;
    if (!items.length){ dd.innerHTML = '<div class="hns-empty">Aucun hôtel trouvé</div>'; }
    else { dd.innerHTML = items.map((h,i) =>
      `<div class="hns-it" data-idx="${i}"><strong>${esc(h.name)}</strong><span>${esc(h.city||'')}</span></div>`).join(''); }
    dd.style.display = 'block';
  }
  async function fetchR(q){
    if (q.length < 2) return [];
    try { const r = await fetch('/api/hotels/autocomplete?q=' + encodeURIComponent(q)); if (!r.ok) return []; return await r.json(); }
    catch(e){ return []; }
  }
  function go(h){ if (h && h.url){ dd.style.display='none'; window.location.href = h.url; } }
  function active(){ dd.querySelectorAll('.hns-it').forEach((el,i)=>el.classList.toggle('on', i===idx)); }
  input.addEventListener('input', () => {
    const q = input.value.trim(); clearTimeout(t);
    if (q.length < 2){ dd.style.display='none'; return; }
    t = setTimeout(async () => render(await fetchR(q)), 200);
  });
  input.addEventListener('keydown', (e) => {
    if (dd.style.display === 'none') return;
    if (e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1, items.length-1); active(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1, 0); active(); }
    else if (e.key==='Enter' && idx>=0){ e.preventDefault(); go(items[idx]); }
    else if (e.key==='Escape'){ dd.style.display='none'; }
  });
  dd.addEventListener('mousedown', (e) => {
    const it = e.target.closest('.hns-it'); if (!it) return;
    e.preventDefault(); go(items[parseInt(it.dataset.idx,10)]);
  });
  document.addEventListener('click', (e) => { if (!input.parentElement.contains(e.target)) dd.style.display='none'; });
})();

// Dates par défaut : J+30 → J+33
function defaultDates(){
  const d1 = new Date(Date.now()+30*86400000);
  const d2 = new Date(Date.now()+33*86400000);
  return { ci: d1.toISOString().slice(0,10), co: d2.toISOString().slice(0,10) };
}
const dd = defaultDates();
$('#checkIn').value = dd.ci;
$('#checkOut').value = dd.co;

// Pre-fill destination depuis URL — accepte ?dest=, ?destination=, ?check_in=, ?checkin=
const urlParams = new URLSearchParams(location.search);
const _dest = urlParams.get('dest') || urlParams.get('destination');
const _ci   = urlParams.get('checkin') || urlParams.get('check_in');
const _co   = urlParams.get('checkout') || urlParams.get('check_out');
const _ad   = urlParams.get('adults') || urlParams.get('guests');
if (_dest) $('#dest').value = _dest;
if (_ci)   $('#checkIn').value = _ci;
if (_co)   $('#checkOut').value = _co;
if (_ad && $('#adults'))   $('#adults').value = _ad;
// Si on arrive avec une destination spécifique → lance search direct
if (_dest && _ci && _co) {
  setTimeout(() => { try { doSearch(); } catch(e){} }, 200);
}

// Pills click
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    $('#dest').value = p.dataset.d;
    doSearch();
  });
});

let lastHotels = [];
let lastCtx = null;

// Mapping nom ville → code IATA destination accepté par le catalog HBX
const DEST_CODE_MAP = {
  'madrid':'MAD','paris':'PAR','londres':'LON','london':'LON',
  'barcelone':'BCN','barcelona':'BCN',
};

async function doSearch(){
  const destEl = $('#dest');
  const destRaw = destEl.value.trim();
  const presetCode = (destEl.dataset && destEl.dataset.code) ? destEl.dataset.code.trim().toUpperCase() : '';
  let destCode;
  // Si l'utilisateur tape "Madrid" → on convertit en code "MAD" pour matcher le catalog
  if (presetCode && /^[A-Z0-9]{2,4}$/.test(presetCode)) {
    destCode = presetCode;
  } else if (/^[a-z]{3}$/i.test(destRaw)) {
    destCode = destRaw.toUpperCase();
  } else if (DEST_CODE_MAP[destRaw.toLowerCase()]) {
    destCode = DEST_CODE_MAP[destRaw.toLowerCase()];
  } else {
    try {
      const r0 = await fetch('/api/cities/search?q='+encodeURIComponent(destRaw)+'&limit=1');
      const arr = r0.ok ? await r0.json() : [];
      if (arr.length && arr[0].destination_code) {
        destCode = arr[0].destination_code;
      } else {
        $('#grid').innerHTML = '<div class="empty"><h3>Ville non reconnue</h3><p>Saisissez le code IATA (ex: BCN pour Barcelone) ou choisissez via les suggestions.</p></div>';
        return;
      }
    } catch {
      $('#grid').innerHTML = '<div class="empty"><h3>Ville non reconnue</h3><p>Saisissez le code IATA (ex: BCN pour Barcelone) ou choisissez via les suggestions.</p></div>';
      return;
    }
  }
  const dest = destCode;
  const ci = $('#checkIn').value;
  const co = $('#checkOut').value;
  const adults = parseInt($('#adults').value);
  const stars_min = parseInt($('#filterStars')?.value || '3');
  const budget = $('#filterBudget')?.value || '';
  if (!destRaw || !ci || !co) return;

  const heroDestEl = document.getElementById('heroDest');
  if (heroDestEl) heroDestEl.textContent = dest;
  $('#grid').innerHTML = '<div class="loading"><div class="loading-spinner"></div>Recherche…</div>';
  if ($('#resCount')) $('#resCount').textContent = '—';

  try {
    const params = new URLSearchParams({
      destination: dest, check_in: ci, check_out: co,
      guests: adults, rooms: 1, stars_min, limit: 60,
    });
    const r = await fetch('/api/hotels/search?' + params.toString());
    if (!r.ok) throw new Error('Recherche impossible');
    let data = await r.json();
    // Pascal 2026-06-01 — fix #18 : utiliser quota_status renvoyé par le backend
    // au lieu de deviner via hotels.length (plus fiable).
    const quotaStatus = data.quota_status || 'ok';
    let isLivePricing = (quotaStatus === 'ok') && (data.hotels || []).length > 0;

    // Fallback : si live HBX renvoie 0 (quota épuisé ou destination non couverte),
    // on bascule sur le catalog DB pour afficher au moins les adresses. Tarifs précis confirmés à la sélection.
    if (!isLivePricing){
      const r2 = await fetch(`/api/hbx/catalog/hotels?destination=${dest}&limit=60`);
      if (r2.ok){
        const cat = await r2.json();
        data = { hotels: (cat.hotels || []).map(h => ({
          hotel_code: h.hotel_code,
          name: h.name,
          stars: h.category_stars,
          city: h.city,
          country_code: h.country_code,
          latitude: h.latitude,
          longitude: h.longitude,
          main_photo: h.main_image_url,
          gallery_photos: h.gallery_photos || [],
          images_total: h.images_total || 0,
          best_price: 0,
          best_rate_key: null,
          providers: ['hbx'],
          giata_code: null,
          currency: 'EUR',
          details: {},
        })) };
      }
    }
    window.__abFallbackCatalog = !isLivePricing || (quotaStatus === 'degraded' || quotaStatus === 'exceeded');
    window.__abQuotaStatus = quotaStatus;

    // Adapte le shape v2 → shape interne + extraire features OTA depuis details
    lastHotels = (data.hotels || []).map(h => {
      const det = h.details || {};
      // Récupère détail du best_offer pour board/cancellation
      const boardCode = det.board || det.board_code;
      const cancelPolicies = det.cancellation_policies || [];
      const checkInTs = new Date(_ci || ci).getTime();
      const freeCancel = cancelPolicies.some(p => {
        const amount = parseFloat(p.amount || 0);
        const fromTs = p.from ? new Date(p.from).getTime() : 0;
        return amount === 0 || (fromTs && fromTs > Date.now() + 86400000);
      });
      const refundable = freeCancel || (cancelPolicies.length === 0);
      // Galerie : accepte `gallery` (nouveau format API search 2026-05-31) OU
      // `gallery_photos` (ancien format catalog fallback). Fallback : main_photo seul.
      const gallery = (h.gallery && h.gallery.length)
        ? h.gallery
        : (h.gallery_photos && h.gallery_photos.length)
          ? h.gallery_photos
          : (h.main_photo ? [h.main_photo] : []);
      return {
        code: h.hotel_code,
        name: h.name,
        stars: h.stars,
        price_from: h.best_price,
        image: h.main_photo,
        gallery: gallery,
        images_total: h.images_total || gallery.length,
        city: h.city,
        country_code: h.country_code,
        latitude: h.latitude,
        longitude: h.longitude,
        giata_code: h.giata_code,
        providers: h.providers || [],
        best_rate_key: h.best_rate_key,
        currency: h.currency || 'EUR',
        // Features OTA extraites
        board_code: boardCode,
        free_cancel: freeCancel,
        non_refundable: !refundable && cancelPolicies.length > 0,
        // BUG-2 fix (Pascal 2026-05-31) : on n'invente plus de prix barré ni de % réduc.
        // Si le provider envoie un vrai price_strike ou discount_pct, on le retransmet ;
        // sinon → rien (on n'invente pas de "−15% négocié" magique à la Go Voyages).
        price_strike: h.price_strike || null,
        discount_pct: h.discount_pct || null,
      };
    });
    lastCtx = { ci, co, adults, providers: data.providers_polled };
    // Filtrage budget côté client
    let filtered = lastHotels;
    if (budget) filtered = filtered.filter(h => (h.price_from || 0) <= parseFloat(budget));
    applySortFilter(filtered);
  } catch(e){
    $('#grid').innerHTML = `<div class="empty"><h3>Erreur</h3><p>${esc(e.message)}</p></div>`;
  }
}

function applySortFilter(list){
  if (!list) list = [...lastHotels];
  // RÈGLE STRICTE : pas de photo = pas d'affichage (on n'invente pas)
  list = list.filter(h => h.image && h.image.startsWith('http'));

  // Calcul distance centre-ville en amont (pour filtre + tri)
  list.forEach(h => {
    if (h._distance_km == null && h.latitude && h.longitude && h.city){
      const key = (h.city||'').trim().toUpperCase().split(',')[0].trim();
      const c = CITY_CENTERS_LATLNG[key];
      if (c) h._distance_km = haversineKm(h.latitude, h.longitude, c[0], c[1]);
    }
  });

  // Filtres
  const budget = $('#filterBudget')?.value || '';
  const board  = $('#filterBoard')?.value || '';
  const cancel = $('#filterCancel')?.checked || false;
  const distMax = $('#filterDistance')?.value || '';
  if (budget) list = list.filter(h => (h.price_from || 0) <= parseFloat(budget));
  if (board)  list = list.filter(h => (h.board_code || '').toUpperCase() === board);
  if (cancel) list = list.filter(h => h.free_cancel);
  if (distMax) list = list.filter(h => h._distance_km == null || h._distance_km <= parseFloat(distMax));

  // Tri
  const sort = $('#filterSort')?.value || 'signature';
  list = [...list].sort((a, b) => {
    if (sort === 'price_asc')   return (a.price_from || 0) - (b.price_from || 0);
    if (sort === 'price_desc')  return (b.price_from || 0) - (a.price_from || 0);
    if (sort === 'stars_desc')  return (b.stars || 0) - (a.stars || 0);
    if (sort === 'distance_asc'){
      const da = a._distance_km ?? 9999, db = b._distance_km ?? 9999;
      return da - db;
    }
    // Tri "Signature AirBizness" par défaut : compose étoiles DESC + proximité ASC
    // Score = stars*10 - distance_km. Hôtel 5★ à 1km du centre > 3★ collé au centre.
    const sa = (a.stars||0)*10 - (a._distance_km ?? 30);
    const sb = (b.stars||0)*10 - (b._distance_km ?? 30);
    return sb - sa;
  });
  renderHotels(list, lastCtx);
  if ($('#resCount')) $('#resCount').textContent = list.length + (list.length>1 ? ' hôtels' : ' hôtel');
}

function renderHotels(hotels, ctx){
  if (!hotels.length){
    $('#grid').innerHTML = `<div class="empty">
      <h3>Aucune adresse disponible</h3>
      <p>Essayez d'autres dates ou une autre destination.</p>
    </div>`;
    return;
  }
  const banner = window.__abFallbackCatalog
    ? `<div style="grid-column:1/-1;padding:12px 16px;background:rgba(184,150,46,0.12);color:#d4ae4a;border:1px solid rgba(184,150,46,0.2);border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:6px;">
         Adresses curated AirBizness. <strong>Tarifs hôtel temporairement indisponibles</strong> — nous reconnectons les flux live dans les prochaines heures. Vous pouvez parcourir le catalogue, la réservation reprendra dès que les tarifs reviennent.
       </div>` : '';
  // Utilise le composant partagé /js/carnets.js section 1 (source unique).
  // cardHtml local supprimée — plus de duplication.
  $('#grid').innerHTML = banner + hotels.map(h => window.renderHotelCard(h, ctx)).join('');
}

// Centres des villes couvertes pour calcul distance hôtel → centre
const CITY_CENTERS_LATLNG = {
  PAR:[48.8566,2.3522], PARIS:[48.8566,2.3522],
  MAD:[40.4168,-3.7038], MADRID:[40.4168,-3.7038],
  LON:[51.5074,-0.1278], LONDON:[51.5074,-0.1278], LONDRES:[51.5074,-0.1278],
};
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function fmtKm(km){
  if(km==null||isNaN(km))return null;
  if(km<1)return Math.round(km*1000)+' m';
  if(km<10)return km.toFixed(1).replace('.',',')+' km';
  return Math.round(km)+' km';
}
function distanceCenter(h){
  if(!h.latitude||!h.longitude||!h.city)return null;
  const key=(h.city||'').trim().toUpperCase().split(',')[0].trim();
  const c=CITY_CENTERS_LATLNG[key];
  if(!c)return null;
  return fmtKm(haversineKm(h.latitude,h.longitude,c[0],c[1]));
}

function nightsCount(ctx){
  if (!ctx) return 1;
  const a = new Date(ctx.ci), b = new Date(ctx.co);
  return Math.max(1, Math.round((b-a)/86400000));
}

// ── FAVORIS ❤ (localStorage) ──────────────────────────────────────────────
const FAV_KEY = 'ab_hotel_favorites';
function getFavorites(){
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }
  catch(e){ return []; }
}
function isFavorite(code){
  return getFavorites().includes(String(code));
}
function toggleFavorite(btn, code){
  let favs = getFavorites();
  const k = String(code);
  if (favs.includes(k)){
    favs = favs.filter(x => x !== k);
    btn.classList.remove('faved');
    btn.setAttribute('aria-label','Ajouter aux favoris');
  } else {
    favs.push(k);
    btn.classList.add('faved');
    btn.setAttribute('aria-label','Retirer des favoris');
  }
  localStorage.setItem(FAV_KEY, JSON.stringify(favs));
  btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
}

// ── GALERIE PHOTOS (swipe mobile + arrows desktop) ───────────────────────
function galleryNav(btn, delta){
  const cardImg = btn.closest('.card-img');
  const track = cardImg.querySelector('.gallery-track');
  if (!track) return;
  const cur = parseInt(track.dataset.current || '0', 10);
  const total = parseInt(track.dataset.total || '1', 10);
  let next = (cur + delta + total) % total;
  galleryGoto(track, next);
}
function galleryGoto(track, idx){
  const total = parseInt(track.dataset.total || '1', 10);
  if (idx < 0) idx = 0; if (idx >= total) idx = total - 1;
  track.dataset.current = String(idx);
  track.style.transform = `translateX(-${idx * 100}%)`;
  const cardImg = track.parentElement;
  cardImg.querySelectorAll('.gallery-dot').forEach((d,i) => {
    d.classList.toggle('active', i === idx);
  });
}
// Swipe natif touch — délégué globalement (économise la mémoire avec beaucoup de cards)
document.addEventListener('touchstart', e => {
  const track = e.target.closest('.gallery-track');
  if (!track) return;
  track._sx = e.touches[0].clientX;
  track._sy = e.touches[0].clientY;
  track._moved = false;
}, {passive:true});
document.addEventListener('touchmove', e => {
  const track = e.target.closest('.gallery-track');
  if (!track || track._sx == null) return;
  const dx = e.touches[0].clientX - track._sx;
  const dy = e.touches[0].clientY - track._sy;
  // Si le geste est plus horizontal que vertical → swipe galerie (sinon laisse le scroll page)
  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) track._moved = true;
}, {passive:true});
document.addEventListener('touchend', e => {
  const track = e.target.closest('.gallery-track');
  if (!track || track._sx == null) return;
  if (track._moved){
    const dx = (e.changedTouches[0].clientX) - track._sx;
    if (Math.abs(dx) > 40){
      galleryNav({closest:()=>track.parentElement}, dx > 0 ? -1 : 1);
    }
  }
  track._sx = track._sy = null; track._moved = false;
}, {passive:true});

// cardHtml supprimée — FIX 1 : plus de duplication. Utiliser window.renderHotelCard (carnets.js section 1).

if (window.setupCityAutocomplete) {
  setupCityAutocomplete('dest');
}

doSearch();
