<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Mot de passe oublié — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="/js/carnets.js?v=2026053113"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;--gold:#b8962e;--gold2:#d4ae4a;--text:#f0ece4;--text2:#a09890;--text3:#6a6058;--border:rgba(255,255,255,0.07);--red:#e87a7a;--green:#7ddc94;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:34px 30px;max-width:420px;width:100%;}
.logo{font-family:'DM Serif Display',serif;font-size:24px;text-align:center;}
.logo em{color:var(--gold2);font-style:italic;}
h1{font-family:'DM Serif Display',serif;font-size:24px;margin:16px 0 8px;text-align:center;}
.sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:22px;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{font-size:12px;color:var(--text2);margin-bottom:6px;display:block;}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;}
.field input:focus{border-color:var(--gold2);}
.btn{width:100%;padding:14px;background:var(--gold);color:#000;border:none;border-radius:8px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:6px;}
.btn:hover:not(:disabled){background:var(--gold2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:14px;padding:12px;border-radius:8px;font-size:13px;display:none;text-align:center;}
.msg.ok{background:rgba(125,220,148,0.15);color:var(--green);border:1px solid rgba(125,220,148,0.3);display:block;}
.msg.err{background:rgba(232,122,122,0.12);color:var(--red);border:1px solid rgba(232,122,122,0.3);display:block;}
.alt{text-align:center;margin-top:18px;font-size:13px;color:var(--text2);}
.alt a{color:var(--gold2);text-decoration:none;font-weight:600;}
.back{display:block;text-align:center;color:var(--text3);font-size:12px;margin-top:18px;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Air<em>Bizness</em></div>
  <h1>Mot de passe oublié ?</h1>
  <p class="sub">Pas de panique. Saisissez votre email, on vous envoie un lien pour redéfinir votre mot de passe en 30 secondes.</p>
  <form id="form">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="votre@email.com">
    </div>
    <button type="submit" class="btn" id="btn">Envoyer le lien</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="alt">Vous vous souvenez ? <a href="/login.html">Se connecter</a></div>
  <a href="/" class="back">← Retour à l'accueil</a>
</div>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  msg.className = 'msg';
  btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    const r = await fetch('/api/auth/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: document.getElementById('email').value.trim()})
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Erreur');
    msg.classList.add('ok');
    msg.textContent = '✓ Si cet email existe, un lien a été envoyé. Vérifiez votre boîte (et spams).';
  } catch (e) {
    msg.classList.add('err');
    msg.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Envoyer le lien';
  }
});
</script>
</body>
</html>
