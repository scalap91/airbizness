<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Connexion — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script src="/js/carnets.js?v=2026053113"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;
  --gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);
  --text:#f0ece4;--text2:#a09890;--text3:#6a6058;
  --border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);
  --red:#e87a7a;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:34px 30px;max-width:420px;width:100%;}
.auth-logo{font-family:'DM Serif Display',serif;font-size:24px;color:var(--text);margin-bottom:6px;text-align:center;}
.auth-logo em{color:var(--gold2);font-style:italic;}
.auth-title{font-family:'DM Serif Display',serif;font-size:26px;margin:18px 0 6px;text-align:center;line-height:1.2;}
.auth-title em{color:var(--gold2);font-style:italic;}
.auth-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:24px;}
.field{margin-bottom:14px;}
.field-label{font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:0.3px;}
.field input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--gold2);}
.submit-btn{width:100%;padding:14px;background:var(--gold);color:#000;border:none;border-radius:8px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;margin-top:8px;transition:background .15s;}
.submit-btn:hover:not(:disabled){background:var(--gold2);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;}
.err{color:var(--red);font-size:13px;margin-top:12px;text-align:center;display:none;}
.err.show{display:block;}
.alt{text-align:center;margin-top:18px;font-size:13px;color:var(--text2);}
.alt a{color:var(--gold2);text-decoration:none;font-weight:600;}
.alt a:hover{text-decoration:underline;}
.back{display:block;text-align:center;color:var(--text3);font-size:12px;margin-top:20px;text-decoration:none;}
.back:hover{color:var(--text2);}
</style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-logo">Air<em>Bizness</em></div>
    <h1 class="auth-title">Bon <em>retour</em> parmi nous</h1>
    <p class="auth-sub">Connectez-vous à votre espace voyageur.</p>

    <form id="login-form">
      <div class="field">
        <div class="field-label">Email</div>
        <input type="email" id="email" required autocomplete="email" placeholder="votre@email.com">
      </div>
      <div class="field">
        <div class="field-label">Mot de passe</div>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Se connecter</button>
      <div class="err" id="err"></div>
    </form>

    <div class="alt"><a href="/forgot-password.html">Mot de passe oublié ?</a> · <a href="/magic-link.html">Lien magique</a></div>
    <div class="alt">Pas encore de compte ? <a href="/signup.html">Créer un compte</a></div>
    <a href="/" class="back">← Retour à l'accueil</a>
  </div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Connexion…';
  try {
    await window.Auth.login({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    // Redirect vers /compte ou page d'origine (?next=)
    const next = new URLSearchParams(location.search).get('next') || '/compte.html';
    location.href = next;
  } catch (e) {
    err.textContent = e.message || 'Connexion échouée';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Se connecter';
  }
});

// Si déjà connecté, redirect direct
if (window.Auth && window.Auth.isLoggedIn()) {
  location.href = new URLSearchParams(location.search).get('next') || '/compte.html';
}
</script>
</body>
</html>
