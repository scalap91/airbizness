<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>Confirmation hôtel — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;
  --gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);
  --green:#7dc97d;--green-dim:rgba(125,201,125,0.12);
  --text:#f0ece4;--text2:#a09890;--text3:#6a6058;
  --border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;line-height:1.55;}

.header{display:flex;align-items:center;padding:0 32px;height:64px;background:rgba(15,15,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-hex{width:32px;height:32px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:grid;place-items:center;font-size:13px;color:#000;}
.logo-text{font-size:19px;font-weight:600;color:var(--text);}

.main{padding:120px 28px 80px;max-width:720px;margin:0 auto;}

.success-mark{width:80px;height:80px;border-radius:50%;background:var(--green-dim);border:1px solid var(--green);display:grid;place-items:center;margin:0 auto 24px;color:var(--green);font-size:36px;}
.title{font-family:'DM Serif Display',serif;font-size:32px;text-align:center;margin-bottom:8px;}
.title em{font-style:italic;color:var(--gold2);}
.sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:36px;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:28px;margin-bottom:18px;}
.card-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:18px;}

.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);font-size:13px;}
.row:first-of-type{border-top:none;}
.row .l{color:var(--text2);}
.row .v{color:var(--text);font-weight:500;}
.row .v.big{font-family:'DM Serif Display',serif;font-size:18px;color:var(--gold2);font-weight:400;}

.ref{font-family:monospace;background:var(--gold-dim);color:var(--gold2);padding:2px 10px;border-radius:99px;font-size:12px;letter-spacing:0.5px;}

.actions{display:flex;gap:12px;margin-top:24px;justify-content:center;flex-wrap:wrap;}
.btn{padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:500;font-size:14px;cursor:pointer;font-family:inherit;border:none;}
.btn-primary{background:var(--gold);color:#000;}
.btn-primary:hover{background:var(--gold2);}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-secondary:hover{background:var(--bg3);}

.loading{text-align:center;padding:80px 24px;color:var(--text3);}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

.note{background:var(--gold-dim);border:1px solid var(--border2);border-radius:8px;padding:14px 16px;font-size:12px;color:var(--gold2);margin-top:18px;line-height:1.6;}
.note::before{content:'✦ ';}
.demo-banner{background:rgba(96,165,250,0.08);border:1px solid rgba(96,165,250,0.25);border-radius:8px;padding:11px 14px;font-size:12px;color:#9bc4ff;margin-bottom:18px;line-height:1.5;letter-spacing:0.1px;}
.demo-banner b{color:#cbe0ff;font-weight:500;}
</style>
<script src="/i18n.js" defer></script>
<script defer src="/shared-chrome.js"></script>
</head>
<body>
<div id="ab-header"></div>
<div id="ab-bottomnav"></div>

<header class="header">
  <a href="/" class="logo">
    <div class="logo-hex">AB</div>
    <div class="logo-text">AirBizness</div>
  </a>
</header>

<main class="main" id="main">
  <div class="loading"><div class="loading-spinner"></div>Chargement de votre confirmation…</div>
</main>

<script>
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

async function loadBooking(){
  const p = new URLSearchParams(location.search);
  const ref = p.get('ref');
  if (!ref){
    $('#main').innerHTML = `<div class="loading">Référence manquante.<br><a href="/" style="color:var(--gold2)">Retour</a></div>`;
    return;
  }
  try {
    const r = await fetch(`/api/hotel/booking/${ref}`);
    if (!r.ok) throw new Error('Réservation introuvable');
    const b = await r.json();
    render(b);
  } catch(e){
    $('#main').innerHTML = `<div class="loading">${esc(e.message)}<br><br><a href="/" style="color:var(--gold2)">Retour à l'accueil</a></div>`;
  }
}

function render(b){
  const isConfirmed = b.status === 'confirmed';
  const checkIn = new Date(b.check_in).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const checkOut = new Date(b.check_out).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});

  const demoBanner = b.is_mock ? `
    <div class="demo-banner">
      <b>Réservation de démonstration.</b>
      Cette réservation est un test de bout en bout du parcours AirBizness. Aucune nuit n'a été engagée auprès de l'hôtel.
    </div>` : '';

  $('#main').innerHTML = `
    ${demoBanner}
    <div class="success-mark">${isConfirmed ? '✓' : '⌛'}</div>
    <h1 class="title">${isConfirmed ? 'Réservation <em>confirmée.</em>' : 'En cours de finalisation…'}</h1>
    <p class="sub">${isConfirmed ?
      `Un email de confirmation a été envoyé à <b>${esc(b.user_email)}</b>` :
      'Statut : ' + esc(b.status)}</p>

    <div class="card">
      <div class="card-title">Votre séjour</div>
      <div class="row"><span class="l">Référence</span><span class="ref">${esc(b.airbizness_ref)}</span></div>
      ${b.hbx_reference ? `<div class="row"><span class="l">Confirmation hôtel</span><span class="v">${esc(b.hbx_reference)}</span></div>` : ''}
      <div class="row"><span class="l">Hôtel</span><span class="v">${esc(b.hotel_name)}</span></div>
      <div class="row"><span class="l">Arrivée</span><span class="v">${checkIn}</span></div>
      <div class="row"><span class="l">Départ</span><span class="v">${checkOut}</span></div>
      <div class="row"><span class="l">Nuits</span><span class="v">${b.nights}</span></div>
      <div class="row"><span class="l">Voyageurs</span><span class="v">${b.adults} adulte${b.adults>1?'s':''}</span></div>
      <div class="row"><span class="l">Titulaire</span><span class="v">${esc(b.holder_name)} ${esc(b.holder_surname)}</span></div>
      <div class="row"><span class="l">Total payé</span><span class="v big">${(b.gross_price || 0).toFixed(0)}€</span></div>
    </div>

    ${optionsCard(b)}

    <div class="note">
      Réservé directement sur AirBizness. Notre équipe est disponible pour toute question.
      Conservez votre référence pour le suivi de votre voyage.
    </div>

    <div class="actions">
      <a href="/api/booking/${esc(b.airbizness_ref)}/voucher.pdf" target="_blank" class="btn btn-primary">📄 Télécharger mon voucher PDF</a>
      <a href="/mes-voyages.html" class="btn btn-secondary">Mes voyages</a>
      <a href="/" class="btn btn-secondary">Retour à l'accueil</a>
      ${isConfirmed && b.status !== 'cancelled' ? `
        <button class="btn btn-secondary" onclick="cancelBooking('${esc(b.airbizness_ref)}', '${esc(b.user_email)}')">Annuler cette réservation</button>
      ` : ''}
    </div>
  `;
}

function optionsCard(b){
  const o = b.options;
  if (!o) return '';
  const hasTransferHbx = !!(o.transfer_rate_key && o.transfer_price > 0);
  const hasAny = o.late_checkin || o.insurance || (o.transfer && o.transfer !== 'none')
              || (o.special_requests && o.special_requests.trim()) || hasTransferHbx;
  if (!hasAny) return '';
  const rows = [];
  const adults = b.adults || 1;
  if (o.late_checkin) rows.push({l:'Late check-in (arrivée après 20h)', v:'25 €'});
  if (o.insurance) rows.push({l:`Assurance Multirisque (${adults} pax)`, v:(35*Math.max(1,adults)).toFixed(0)+' €'});
  // Transfer HBX dynamique
  if (hasTransferHbx){
    const meta = o.transfer_meta || {};
    const subParts = [meta.vehicle, meta.operator,
                       meta.duration_min ? (meta.duration_min+' min') : null,
                       meta.airport_iata ? ('Aéroport '+meta.airport_iata) : null]
                     .filter(Boolean).join(' · ');
    rows.push({l: o.transfer_label || 'Transfert sélectionné',
               v: Number(o.transfer_price).toFixed(0) + ' €',
               note: subParts});
    if (b.transfer_booking_ref){
      rows.push({l:'Référence transfert', v: b.transfer_booking_ref});
    }
  } else if (o.transfer === 'oneway') {
    rows.push({l:'Transfert aéroport (aller)', v:'35 €'});
  } else if (o.transfer === 'roundtrip') {
    rows.push({l:'Transfert aéroport (aller-retour)', v:'60 €'});
  }
  if (o.special_requests && o.special_requests.trim()) rows.push({l:'Demandes spéciales', v:'—', note:o.special_requests});

  const total = o.options_total || 0;
  const roomTotal = o.room_total || ((b.gross_price || 0) - total);

  return `
    <div class="card">
      <div class="card-title">Options &amp; services</div>
      ${rows.map(r => `
        <div class="row">
          <span class="l">${esc(r.l)}${r.note ? `<br><small style="color:#7a7068;font-size:11px;">${esc(r.note)}</small>` : ''}</span>
          <span class="v">${esc(r.v)}</span>
        </div>
      `).join('')}
      <div class="row" style="margin-top:6px;border-top:1px solid #2a2a2a;">
        <span class="l">Sous-total hôtel</span>
        <span class="v">${roomTotal.toFixed(0)} €</span>
      </div>
      <div class="row">
        <span class="l">Sous-total options</span>
        <span class="v" style="color:var(--gold2);">+${total.toFixed(0)} €</span>
      </div>
    </div>
  `;
}

async function cancelBooking(ref, email){
  if (!confirm('Êtes-vous sûr d\'annuler cette réservation ?\\n\\nLe remboursement sera traité automatiquement selon nos conditions.')) return;
  try {
    const r = await fetch('/api/hbx/booking/cancel', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ airbizness_ref: ref, email_confirm: email, simulate: false }),
    });
    if (!r.ok) {
      const err = await r.json();
      throw new Error(err.detail || 'Annulation impossible');
    }
    const data = await r.json();
    alert(`Annulation confirmée.${data.stripe_refunded ? '\\nRemboursement Stripe initié.' : ''}`);
    location.reload();
  } catch(e){
    alert('Erreur : ' + e.message);
  }
}

loadBooking();
</script>
<div id="ab-footer"></div>
</body>
</html>
