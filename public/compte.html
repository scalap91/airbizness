<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Mon compte — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script defer src="/shared-chrome.js"></script>
<script src="/js/carnets.js?v=2026053113"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;
  --gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);
  --text:#f0ece4;--text2:#a09890;--text3:#6a6058;
  --border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);
  --red:#e87a7a;--green:#7ddc94;--green-dim:rgba(125,220,148,0.12);
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.wrap{max-width:1000px;margin:30px auto;padding:0 20px;}
/* Hero */
.hero{background:linear-gradient(135deg, rgba(184,150,46,0.15) 0%, var(--bg2) 60%);border:1px solid var(--border2);border-radius:14px;padding:30px 28px;margin-bottom:24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
.avatar-big{width:72px;height:72px;border-radius:50%;background:var(--bg3);display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:28px;color:var(--gold2);font-weight:600;flex-shrink:0;}
.hero-info{flex:1;min-width:200px;}
.hero-greeting{font-family:'DM Serif Display',serif;font-size:28px;line-height:1.15;margin-bottom:5px;}
.hero-greeting em{color:var(--gold2);font-style:italic;}
.hero-email{font-size:13px;color:var(--text2);}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn-ghost{padding:10px 16px;background:transparent;color:var(--text);border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-ghost:hover{border-color:var(--gold2);color:var(--gold2);}
.btn-ghost.danger:hover{border-color:var(--red);color:var(--red);}
/* Email verified badge */
.verif-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:4px;margin-top:5px;}
.verif-badge.ok{background:var(--green-dim);color:var(--green);}
.verif-badge.no{background:rgba(232,122,122,0.12);color:var(--red);cursor:pointer;}
.verif-badge.no:hover{filter:brightness(1.15);}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:14px;}
.tile{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px 20px;text-decoration:none;color:inherit;transition:all .15s;display:flex;flex-direction:column;}
.tile:hover{border-color:var(--gold2);transform:translateY(-2px);}
.tile-icon{font-size:28px;margin-bottom:12px;line-height:1;}
.tile-title{font-family:'DM Serif Display',serif;font-size:17px;margin-bottom:5px;}
.tile-sub{font-size:12.5px;color:var(--text2);line-height:1.5;flex:1;}
.tile-count{font-size:11px;color:var(--gold2);font-weight:600;letter-spacing:0.3px;text-transform:uppercase;margin-top:10px;}
/* Auth-required state */
.auth-required{text-align:center;padding:80px 20px;}
.auth-required h2{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:10px;}
.auth-required p{color:var(--text2);font-size:14px;margin-bottom:22px;}
.auth-required .btn{display:inline-block;padding:13px 22px;background:var(--gold);color:#000;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;margin:0 5px;}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);padding:13px 22px;border-radius:8px;font-size:13.5px;z-index:1000;display:none;}
.toast.ok{border-color:var(--green);}
.toast.show{display:block;}
@media(max-width:560px){
  .hero{padding:22px 18px;}
  .hero-greeting{font-size:22px;}
  .avatar-big{width:58px;height:58px;font-size:22px;}
}
</style>
</head>
<body>
<div id="ab-header"></div>

<h1 style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;">Mon compte AirBizness</h1>

<div class="wrap" id="main">
  <!-- Rendu dynamique selon auth state -->
</div>

<div class="toast" id="toast"></div>

<script>
const main = document.getElementById('main');
const toast = document.getElementById('toast');

function showToast(msg, type) {
  toast.className = 'toast ' + (type || 'ok') + ' show';
  toast.textContent = msg;
  setTimeout(() => toast.className = 'toast', 3500);
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function render() {
  if (!window.Auth || !window.Auth.isLoggedIn()) {
    main.innerHTML = `
      <div class="auth-required">
        <h2>Votre <em style="color:var(--gold2);font-style:italic;">espace voyageur</em></h2>
        <p>Connectez-vous pour accéder à vos voyages, vos voyageurs enregistrés et vos alertes.</p>
        <a href="/login.html?next=${encodeURIComponent(location.pathname)}" class="btn">Se connecter</a>
        <a href="/signup.html?next=${encodeURIComponent(location.pathname)}" class="btn" style="background:transparent;color:var(--gold2);border:1px solid var(--gold2);">Créer un compte</a>
      </div>`;
    return;
  }

  const u = window.Auth.getUser() || {};
  // Initiales
  const givenName = u.given_name || (u.full_name || '').split(' ')[0] || 'Voyageur';
  const familyName = u.full_name ? u.full_name.split(' ').slice(1).join(' ') : '';
  const initials = ((givenName[0]||'?') + (familyName[0]||'')).toUpperCase();

  // Email verified badge
  const verified = u.email_verified;
  const verifBadge = verified
    ? '<div class="verif-badge ok">✓ Email vérifié</div>'
    : '<div class="verif-badge no" onclick="sendVerify()" title="Cliquer pour renvoyer">⚠ Email non vérifié — Envoyer le lien</div>';

  // Check banner email_verified (depuis redirect verify)
  let banner = '';
  if (new URLSearchParams(location.search).get('email_verified') === '1') {
    banner = '<div style="background:var(--green-dim);border:1px solid rgba(125,220,148,0.3);color:var(--green);padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13px;">✓ Email confirmé avec succès.</div>';
  }

  main.innerHTML = `
    ${banner}
    <div class="hero">
      <div class="avatar-big">${initials}</div>
      <div class="hero-info">
        <div class="hero-greeting">Bonjour <em>${escapeHtml(givenName)}</em></div>
        <div class="hero-email">${escapeHtml(u.email)}</div>
        ${verifBadge}
      </div>
      <div class="hero-actions">
        <button class="btn-ghost danger" onclick="doLogout()">Déconnexion</button>
      </div>
    </div>

    <div class="grid">
      <a href="/compte-voyageurs.html" class="tile">
        <div class="tile-icon">👥</div>
        <div class="tile-title">Mes voyageurs</div>
        <div class="tile-sub">Carnet des personnes avec qui vous voyagez. Sélection en 1 clic au moment de réserver.</div>
        <div class="tile-count" id="cnt-passengers">— voyageurs</div>
      </a>
      <a href="/mes-voyages.html" class="tile">
        <div class="tile-icon">✈</div>
        <div class="tile-title">Mes voyages</div>
        <div class="tile-sub">Historique vol + hôtel + séjour. Tous vos billets et confirmations en un endroit.</div>
        <div class="tile-count" id="cnt-bookings">—</div>
      </a>
      <a href="/mes-alertes.html" class="tile">
        <div class="tile-icon">🔔</div>
        <div class="tile-title">Mes alertes</div>
        <div class="tile-sub">Surveillez les baisses de prix sur vos routes favorites. Notification dès qu'un deal apparaît.</div>
        <div class="tile-count" id="cnt-alerts">—</div>
      </a>
      <a href="/" class="tile">
        <div class="tile-icon">🔍</div>
        <div class="tile-title">Nouvelle recherche</div>
        <div class="tile-sub">Vol, hôtel, séjour complet ou activités. Prix négociés sans intermédiaire.</div>
        <div class="tile-count">Rechercher →</div>
      </a>
    </div>`;

  // Charge les compteurs async
  loadCounters();
}

async function loadCounters() {
  // Voyageurs enregistrés
  try {
    const r = await window.Auth.fetch('/api/user/passengers');
    if (r.ok) {
      const d = await r.json();
      const n = (d.passengers || []).length;
      const el = document.getElementById('cnt-passengers');
      if (el) el.textContent = n + ' voyageur' + (n>1?'s':'') + ' enregistré' + (n>1?'s':'');
    }
  } catch(_){}
  // Bookings + Alertes : endpoints pas encore branchés au user, on laisse "—"
}

async function sendVerify() {
  const badge = document.querySelector('.verif-badge.no');
  if (badge) {
    badge.style.pointerEvents = 'none';
    badge.style.opacity = '0.7';
    badge.textContent = 'Envoi en cours…';
  }
  try {
    const r = await window.Auth.fetch('/api/auth/send-verify', {method: 'POST'});
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'Erreur');
    if (badge) {
      badge.textContent = '✓ Lien envoyé, vérifie ta boîte mail';
      badge.style.color = '#4bbf73';
      badge.style.borderColor = 'rgba(75,191,115,0.4)';
      badge.style.background = 'rgba(75,191,115,0.08)';
      badge.style.opacity = '1';
    }
    showToast('✓ ' + (d.msg || 'Email envoyé. Vérifiez votre boîte (et spams).'));
  } catch (e) {
    if (badge) {
      badge.textContent = '✗ Erreur, réessayer';
      badge.style.color = '#e0564a';
      badge.style.pointerEvents = 'auto';
      badge.style.opacity = '1';
    }
    showToast('Erreur : ' + e.message, 'err');
  }
}
window.sendVerify = sendVerify;

function doLogout() {
  if (!confirm('Vous déconnecter ?')) return;
  window.Auth.logout();
  location.href = '/';
}
window.doLogout = doLogout;

// Re-render au changement auth (login/logout depuis un autre onglet)
window.addEventListener('ab-auth-change', render);

render();
</script>
</body>
</html>
