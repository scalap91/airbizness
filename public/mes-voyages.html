<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Mes voyages — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script defer src="/shared-chrome.js"></script>
<script src="/js/carnets.js?v=2026053113"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;--gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);--text:#f0ece4;--text2:#a09890;--text3:#6a6058;--border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);--green:#7ddc94;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.wrap{max-width:880px;margin:30px auto;padding:0 20px;}
.back{display:inline-block;color:var(--text2);text-decoration:none;font-size:13px;margin-bottom:16px;}
.back:hover{color:var(--gold2);}
h1{font-family:'DM Serif Display',serif;font-size:30px;margin-bottom:6px;}
h1 em{color:var(--gold2);font-style:italic;}
.sub{color:var(--text2);font-size:14px;margin-bottom:24px;}
.empty{padding:60px 20px;text-align:center;color:var(--text3);background:var(--bg2);border:1px dashed var(--border);border-radius:12px;}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:0.4;}
.empty .cta{display:inline-block;margin-top:18px;padding:11px 22px;background:var(--gold);color:#000;text-decoration:none;border-radius:8px;font-weight:600;font-size:13px;}
.bk{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.bk-icon{width:48px;height:48px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-size:22px;flex-shrink:0;}
.bk-info{flex:1;min-width:180px;}
.bk-route{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);margin-bottom:3px;}
.bk-meta{font-size:12px;color:var(--text2);}
.bk-price{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold2);}
.bk-status{display:inline-block;padding:3px 9px;border-radius:5px;font-size:10px;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;}
.bk-status.confirmed{background:rgba(125,220,148,0.15);color:var(--green);}
.bk-status.pending,.bk-status.payment_pending{background:var(--gold-dim);color:var(--gold2);}
.bk-status.cancelled{background:rgba(232,122,122,0.12);color:#e87a7a;}
.auth-required{text-align:center;padding:80px 20px;}
.auth-required h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px;}
.auth-required p{color:var(--text2);margin-bottom:18px;font-size:14px;}
.btn{display:inline-block;padding:13px 22px;background:var(--gold);color:#000;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;}
</style>
</head>
<body>
<div id="ab-header"></div>
<div class="wrap" id="main"></div>

<script>
const main = document.getElementById('main');

async function render() {
  if (!window.Auth || !window.Auth.isLoggedIn()) {
    main.innerHTML = `
      <div class="auth-required">
        <h2>Connexion requise</h2>
        <p>Connectez-vous pour voir l'historique de vos voyages.</p>
        <a class="btn" href="/login.html?next=${encodeURIComponent(location.pathname)}">Se connecter</a>
      </div>`;
    return;
  }
  main.innerHTML = `
    <a href="/compte.html" class="back">← Mon compte</a>
    <h1>Mes <em>voyages</em></h1>
    <p class="sub">Historique de vos réservations vol, hôtel et séjour AirBizness.</p>
    <div id="list"><div class="empty">Chargement…</div></div>`;
  try {
    const r = await window.Auth.fetch('/api/user/bookings');
    const d = await r.json();
    renderList(d.bookings || []);
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty">Erreur : ${e.message}</div>`;
  }
}

function renderList(bookings) {
  const list = document.getElementById('list');
  if (!bookings.length) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon">✈</div>
        <div style="font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);margin-bottom:8px;">Aucun voyage encore</div>
        <p>Réservez votre 1er vol, hôtel ou séjour avec AirBizness — il apparaîtra ici.</p>
        <a class="cta" href="/">Lancer une recherche →</a>
      </div>`;
    return;
  }
  const ICONS = {flight:'✈', hotel:'🏨', pack:'🧳', activity:'🎟'};
  const STATUS_FR = {confirmed:'Confirmé', pending:'En attente', cancelled:'Annulé', payment_pending:'Paiement en cours'};
  const cards = bookings.map(b => {
    const icon = ICONS[b.type] || '·';
    const route = b.origin && b.destination
      ? `${b.origin} → ${b.destination}`
      : (b.destination || b.ref || 'Voyage');
    const dateStr = b.travel_date
      ? new Date(b.travel_date).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})
      : new Date(b.created_at).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
    const statusKey = (b.status || '').toLowerCase();
    const statusFr = STATUS_FR[statusKey] || b.status || '';
    const provider = b.provider || '';
    return `
      <div class="bk">
        <div class="bk-icon">${icon}</div>
        <div class="bk-info">
          <div class="bk-route">${escapeHtml(route)}</div>
          <div class="bk-meta">${escapeHtml(dateStr)}${provider ? ' · ' + escapeHtml(provider) : ''} · <span class="bk-status ${statusKey}">${escapeHtml(statusFr)}</span></div>
        </div>
        ${b.price ? `<div class="bk-price">${Math.round(b.price)}€</div>` : ''}
      </div>`;
  }).join('');
  list.innerHTML = cards;
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('ab-auth-change', render);
render();
</script>
</body>
</html>
