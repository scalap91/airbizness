<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Activités — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;
  --gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);
  --text:#f0ece4;--text2:#a09890;--text3:#6a6058;
  --border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;line-height:1.55;}

.header{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:64px;background:rgba(15,15,15,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-hex{width:32px;height:32px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:grid;place-items:center;font-size:13px;color:#000;}
.logo-text{font-size:19px;font-weight:600;color:var(--text);}
.back{color:var(--text2);font-size:13px;text-decoration:none;}

.hero{padding:88px 32px 28px;background:linear-gradient(180deg,#1a1a1a 0%,var(--bg) 100%);border-bottom:1px solid var(--border);}
.hero-inner{max-width:1200px;margin:0 auto;}
.hero-tag{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);margin-bottom:10px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:34px;line-height:1.1;margin-bottom:8px;}
.hero-title em{font-style:italic;color:var(--gold2);}
.hero-sub{color:var(--text2);font-size:14px;margin-bottom:24px;}

.search-bar{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px;display:grid;grid-template-columns:1.2fr 1fr 1fr 0.8fr auto;gap:12px;align-items:end;}
@media(max-width:820px){.search-bar{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.search-bar{grid-template-columns:1fr;}}
.sf{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.sf-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.sf input,.sf select{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:14px;}
.sf input[type=date]{color-scheme:dark;}
.btn-search{padding:14px 28px;background:var(--gold);border:none;color:#000;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px;}
.btn-search:hover{background:var(--gold2);}

.pills{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.pills::-webkit-scrollbar{display:none;}
.pill{flex:0 0 auto;padding:6px 14px;background:transparent;border:1px solid var(--border);color:var(--text2);font-size:13px;border-radius:99px;cursor:pointer;font-family:inherit;}
.pill:hover{border-color:var(--border2);color:var(--gold2);}
.pill.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:500;}

.results{padding:36px 32px 80px;max-width:1200px;margin:0 auto;}
.results-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:14px;flex-wrap:wrap;}
.results-title{font-family:'DM Serif Display',serif;font-size:20px;}
.results-title em{font-style:italic;color:var(--gold2);}
.results-count{color:var(--text2);font-size:13px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .2s,transform .15s;text-decoration:none;color:inherit;}
.card:hover{border-color:var(--border2);transform:translateY(-2px);}
.card-img{aspect-ratio:16/10;background:linear-gradient(135deg,#1a1410 0%,#1a1a1a 60%,#1a1f2a 100%);position:relative;display:flex;align-items:center;justify-content:center;}
.card-img-placeholder{font-family:'DM Serif Display',serif;font-size:3.5rem;color:var(--gold);opacity:0.22;}
.card-duration{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text);background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);padding:4px 10px;border-radius:99px;}
.card-body{padding:18px;flex:1;display:flex;flex-direction:column;}
.card-name{font-family:'DM Serif Display',serif;font-size:18px;line-height:1.25;margin-bottom:8px;letter-spacing:-0.01em;}
.card-meta{font-size:12px;color:var(--text3);margin-bottom:auto;}
.card-bottom{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
.card-price-label{font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;}
.card-price{font-family:'DM Serif Display',serif;font-size:22px;color:var(--gold2);line-height:1;}
.card-arrow{color:var(--gold2);font-size:14px;}

.loading{padding:60px 24px;text-align:center;color:var(--text3);}
.loading-spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:60px 24px;color:var(--text3);}
.empty h3{font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);margin-bottom:10px;}
</style>
<script src="/i18n.js" defer></script>
<script defer src="/shared-chrome.js"></script>
</head>
<body>
<div id="ab-header"></div>
<div id="ab-bottomnav"></div>

<header class="header">
  <a href="/" class="logo">
    <div class="logo-hex">AB</div>
    <div class="logo-text">AirBizness</div>
  </a>
  <a href="/" class="back">← Accueil</a>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-tag">Expériences & visites</div>
    <h1 class="hero-title">Activités <em>signature</em></h1>
    <p class="hero-sub">Visites guidées, billets attractions, expériences locales. Réservation directe sur AirBizness.</p>

    <div class="search-bar">
      <div class="sf">
        <div class="sf-label">Destination</div>
        <select id="dest">
          <option value="PAR">Paris</option>
          <option value="MAD">Madrid</option>
          <option value="BCN">Barcelone</option>
          <option value="LON">Londres</option>
          <option value="ROM">Rome</option>
          <option value="NYC">New York</option>
          <option value="TYO">Tokyo</option>
        </select>
      </div>
      <div class="sf">
        <div class="sf-label">Date début</div>
        <input type="date" id="dateFrom">
      </div>
      <div class="sf">
        <div class="sf-label">Date fin</div>
        <input type="date" id="dateTo">
      </div>
      <div class="sf">
        <div class="sf-label">Adultes</div>
        <select id="adults">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <button class="btn-search" onclick="doSearch()">Rechercher</button>
    </div>

    <div class="pills">
      <button class="pill active" data-d="PAR">Paris</button>
      <button class="pill" data-d="MAD">Madrid</button>
      <button class="pill" data-d="BCN">Barcelone</button>
      <button class="pill" data-d="LON">Londres</button>
      <button class="pill" data-d="ROM">Rome</button>
    </div>
  </div>
</section>

<section class="results">
  <div class="results-head">
    <div class="results-title">Activités à <em id="destLabel">Paris</em></div>
    <div class="results-count" id="resCount">—</div>
  </div>
  <div id="grid" class="grid">
    <div class="loading"><div class="loading-spinner"></div>Recherche…</div>
  </div>
</section>

<script>
// Concierge hôtelier — persiste on_behalf_of dès l'arrivée (Pascal 2026-05-24)
(function(){
  try {
    const _u = new URLSearchParams(location.search);
    const obh = _u.get('on_behalf_of');
    if (obh){
      sessionStorage.setItem('ab_on_behalf_of', obh);
      const gn = _u.get('guest_name'); if (gn) sessionStorage.setItem('ab_guest_name', gn);
      const ge = _u.get('guest_email'); if (ge) sessionStorage.setItem('ab_guest_email', ge);
      const gr = _u.get('guest_ref'); if (gr) sessionStorage.setItem('ab_guest_ref', gr);
    }
  } catch(e){}
})();
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

const dd = (() => { const a = new Date(Date.now()+30*86400000), b = new Date(Date.now()+33*86400000); return {a:a.toISOString().slice(0,10), b:b.toISOString().slice(0,10)};})();
$('#dateFrom').value = dd.a;
$('#dateTo').value = dd.b;

document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    $('#dest').value = p.dataset.d;
    doSearch();
  });
});

async function doSearch(){
  const dest = $('#dest').value;
  const df = $('#dateFrom').value;
  const dt = $('#dateTo').value;
  const ad = parseInt($('#adults').value);
  $('#destLabel').textContent = $('#dest').options[$('#dest').selectedIndex].text;
  $('#grid').innerHTML = '<div class="loading"><div class="loading-spinner"></div>Recherche…</div>';
  $('#resCount').textContent = '—';
  try {
    const r = await fetch(`/api/hbx/activities/search?destination_code=${dest}&date_from=${df}&date_to=${dt}&adults=${ad}&limit=30`);
    if (!r.ok) throw new Error('Erreur');
    const data = await r.json();
    render(data.activities || []);
    $('#resCount').textContent = (data.count || 0) + ' activité' + ((data.count||0)>1?'s':'');
  } catch(e){
    $('#grid').innerHTML = `<div class="empty"><h3>Erreur</h3><p>${esc(e.message)}</p></div>`;
  }
}

function render(items){
  if (!items.length){
    $('#grid').innerHTML = `<div class="empty"><h3>Aucune activité</h3><p>Essayez d'autres dates ou une autre destination.</p></div>`;
    return;
  }
  $('#grid').innerHTML = items.map(a => {
    const initial = (a.name || '?').charAt(0).toUpperCase();
    const ad = parseInt($('#adults').value);
    const params = a.rate_key ? new URLSearchParams({
      rate_key: a.rate_key,
      code: a.code,
      name: a.name,
      dest: a.destination_code || '',
      date: a.operation_date || '',
      price: a.price,
      adults: ad,
    }).toString() : '';
    const href = a.rate_key ? `/activity-checkout.html?${params}` : 'javascript:void(0)';
    return `<a class="card" href="${href}">
      <div class="card-img">
        <div class="card-img-placeholder">${esc(initial)}</div>
        ${a.duration ? `<div class="card-duration">${esc(a.duration)}</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${esc(a.name)}</div>
        <div class="card-meta">${esc(a.country_name || '')}${a.free_cancellation ? ' · annulable' : ''}</div>
        <div class="card-bottom">
          <div>
            <div class="card-price-label">À partir de</div>
            <div class="card-price">${(a.price || 0).toFixed(0)}€</div>
          </div>
          <div class="card-arrow">→</div>
        </div>
      </div>
    </a>`;
  }).join('');
}

doSearch();
</script>
<div id="ab-footer"></div>
</body>
</html>
