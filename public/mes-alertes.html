<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Mes alertes — AirBizness</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<script defer src="/shared-chrome.js"></script>
<script src="/js/carnets.js?v=2026053113"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0f0f0f;--bg2:#161616;--bg3:#1e1e1e;--gold:#b8962e;--gold2:#d4ae4a;--gold-dim:rgba(184,150,46,0.12);--text:#f0ece4;--text2:#a09890;--text3:#6a6058;--border:rgba(255,255,255,0.07);--border2:rgba(184,150,46,0.2);--red:#e87a7a;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
.wrap{max-width:880px;margin:30px auto;padding:0 20px;}
.back{display:inline-block;color:var(--text2);text-decoration:none;font-size:13px;margin-bottom:16px;}
.back:hover{color:var(--gold2);}
h1{font-family:'DM Serif Display',serif;font-size:30px;margin-bottom:6px;}
h1 em{color:var(--gold2);font-style:italic;}
.sub{color:var(--text2);font-size:14px;margin-bottom:24px;}
.empty{padding:60px 20px;text-align:center;color:var(--text3);background:var(--bg2);border:1px dashed var(--border);border-radius:12px;}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:0.4;}
.empty .cta{display:inline-block;margin-top:18px;padding:11px 22px;background:var(--gold);color:#000;text-decoration:none;border-radius:8px;font-weight:600;font-size:13px;}
.al{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin-bottom:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.al-icon{width:46px;height:46px;border-radius:12px;background:var(--gold-dim);display:grid;place-items:center;font-size:20px;color:var(--gold2);flex-shrink:0;}
.al-info{flex:1;min-width:180px;}
.al-route{font-family:'DM Serif Display',serif;font-size:17px;color:var(--text);margin-bottom:3px;}
.al-meta{font-size:12px;color:var(--text2);}
.al-price{font-family:'DM Serif Display',serif;font-size:18px;color:var(--gold2);margin-right:6px;}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:7px;cursor:pointer;display:grid;place-items:center;}
.btn-icon:hover{border-color:var(--red);color:var(--red);}
.auth-required{text-align:center;padding:80px 20px;}
.auth-required h2{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px;}
.auth-required p{color:var(--text2);margin-bottom:18px;font-size:14px;}
.btn{display:inline-block;padding:13px 22px;background:var(--gold);color:#000;text-decoration:none;border-radius:8px;font-weight:600;font-size:14px;}
</style>
</head>
<body>
<div id="ab-header"></div>
<div class="wrap" id="main"></div>

<script>
const main = document.getElementById('main');

async function render() {
  if (!window.Auth || !window.Auth.isLoggedIn()) {
    main.innerHTML = `
      <div class="auth-required">
        <h2>Connexion requise</h2>
        <p>Connectez-vous pour gérer vos alertes prix.</p>
        <a class="btn" href="/login.html?next=${encodeURIComponent(location.pathname)}">Se connecter</a>
      </div>`;
    return;
  }
  main.innerHTML = `
    <a href="/compte.html" class="back">← Mon compte</a>
    <h1>Mes <em>alertes</em></h1>
    <p class="sub">Surveillez les baisses de prix sur vos routes favorites. Notification dès qu'un deal apparaît.</p>
    <div id="list"><div class="empty">Chargement…</div></div>`;
  try {
    const r = await window.Auth.fetch('/api/user/alerts');
    const d = await r.json();
    renderList(d.alerts || []);
  } catch (e) {
    document.getElementById('list').innerHTML = `<div class="empty">Erreur : ${e.message}</div>`;
  }
}

function renderList(alerts) {
  const list = document.getElementById('list');
  if (!alerts.length) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon">🔔</div>
        <div style="font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);margin-bottom:8px;">Aucune alerte active</div>
        <p>Lancez une recherche vol et activez une alerte pour être prévenu quand le prix baisse.</p>
        <a class="cta" href="/">Lancer une recherche →</a>
      </div>`;
    return;
  }
  list.innerHTML = alerts.map(a => `
    <div class="al">
      <div class="al-icon">🔔</div>
      <div class="al-info">
        <div class="al-route">${escapeHtml(a.origin)} → ${escapeHtml(a.destination)}</div>
        <div class="al-meta">Créée le ${new Date(a.created_at).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})}</div>
      </div>
      ${a.target_price ? `<div class="al-price">≤ ${Math.round(a.target_price)}€</div>` : ''}
      <button class="btn-icon" onclick="deleteAlert(${a.id})" title="Supprimer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>`).join('');
}

async function deleteAlert(id) {
  if (!confirm('Supprimer cette alerte ?')) return;
  try {
    const r = await window.Auth.fetch('/api/user/alerts/' + id, {method: 'DELETE'});
    if (!r.ok) throw new Error('Suppression échouée');
    render();
  } catch (e) {
    alert('Erreur : ' + e.message);
  }
}
window.deleteAlert = deleteAlert;

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.addEventListener('ab-auth-change', render);
render();
</script>
</body>
</html>
