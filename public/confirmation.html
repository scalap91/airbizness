<meta name="robots" content="noindex">
<script>
/* 2026-05-24 : page legacy. Elle fabriquait un faux PNR JS + email Brevo (risque
   juridique). Remplacée par redirection vers /flight-confirmation.html quand un
   ?ref= est présent, sinon retour à l'accueil. Snapshot original :
   confirmation.html.bak-legacy-vol-20260524 */
(function(){
  var p = new URLSearchParams(location.search);
  var ref = p.get('ref') || p.get('booking_ref') || '';
  if (ref) {
    location.replace('/flight-confirmation.html?ref=' + encodeURIComponent(ref));
  } else {
    location.replace('/');
  }
})();
</script>
